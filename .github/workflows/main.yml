name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Compila app iOS
        run: |
          xcodebuild \
            -project iOS/MatrixTest.xcodeproj \
            -scheme MatrixTest \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
