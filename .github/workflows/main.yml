name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Mostra gli scheme disponibili
        run: |
          xcodebuild -project iOS/MatrixTest.xcodeproj -list
