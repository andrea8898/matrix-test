name: Build iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Compila app iOS
        run: |
          xcodebuild \
            -project iOS/MatrixTest.xcodeproj \
            -scheme MatrixTest \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Carica app compilata
        uses: actions/upload-artifact@v4
        with:
          name: MatrixTest-app
          path: "build/Build/Products/Debug-iphoneos/Matrix Test.app"
