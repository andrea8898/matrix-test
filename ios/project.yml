name: MatrixTest
options:
  bundleIdPrefix: com.matrix
  deploymentTarget:
    iOS: "17.0"
targets:
  MatrixTest:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matrix.test
        PRODUCT_NAME: Matrix Test
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Matrix Test
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Matrix Test
        NSFaceIDUsageDescription: Matrix usa Face ID per proteggere l'accesso locale.
